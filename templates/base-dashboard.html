
{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <meta name="description" content="MedTech Mitra Dashboard">
    <meta name="author" content="MedTech Mitra">

    <title>{% block title %}MedTech Mitra{% endblock %}</title>

    <!-- Simple DataTables CSS -->
    <link href="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/style.min.css"
          rel="stylesheet">

    <!-- SB Admin CSS -->
    <link href="{% static 'sbadmin/css/styles.css' %}"
          rel="stylesheet">

    <!-- Font Awesome -->
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js"
            crossorigin="anonymous"></script>

    <!-- Page-specific CSS -->
    {% block extra_css %}{% endblock %}

</head>

<body class="sb-nav-fixed">

    <!-- Header -->
    {% include "includes/header.html" %}

    <div id="layoutSidenav">

        <!-- Left Sidebar -->
        {% include "includes/sidebar.html" %}

        <!-- Main Content Area -->
        <div id="layoutSidenav_content">

            <main>

                {% block content %}
                {% endblock %}

            </main>

            <!-- Footer -->
            {% include "includes/footer.html" %}

        </div>

    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
            crossorigin="anonymous"></script>

    <!-- SB Admin JavaScript -->
    <script src="{% static 'sbadmin/js/scripts.js' %}"></script>

    <!-- Chart.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.8.0/Chart.min.js"
            crossorigin="anonymous"></script>

    <!-- Simple DataTables JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/umd/simple-datatables.min.js"
            crossorigin="anonymous"></script>

    <script src="{% static 'sbadmin/js/datatables-simple-demo.js' %}"></script>

    <!-- Page-specific JavaScript -->
    {% block extra_js %}{% endblock %}

</body>
</html>
